<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEMU Men's SEO Center | 男装 SEO 关键词与标题优化中心</title>
    <style>
        :root {
            --primary-color: #fb7701; /* TEMU Brand Orange */
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e1e4e8;
            --tag-bg: #fff3eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 26px;
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            font-size: 14px;
        }

        /* 标题拼装工作区 */
        .builder-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 2px solid var(--primary-color);
        }

        .builder-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .builder-title {
            font-weight: bold;
            color: var(--primary-color);
            font-size: 16px;
        }

        .char-counter {
            font-size: 13px;
            font-weight: bold;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 15px;
            resize: vertical;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .builder-controls {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: #e06800;
        }

        .btn-secondary {
            background-color: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background-color: #d0d0d0;
        }

        /* 搜索与筛选区 */
        .search-section {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 240px;
            padding: 9px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-label {
            font-size: 13px;
            font-weight: bold;
            color: #555;
            margin-right: 4px;
        }

        .filter-btn {
            background: #f0f2f5;
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 16px;
            font-size: 13px;
            color: #444;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        .stats-bar {
            font-size: 12px;
            color: #777;
            padding-top: 4px;
        }

        /* 词库网格 */
        .keywords-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .category-card h3 {
            font-size: 15px;
            border-bottom: 2px solid var(--tag-bg);
            padding-bottom: 8px;
            margin-bottom: 12px;
            color: var(--primary-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .category-card h3 .count {
            font-size: 12px;
            color: #888;
            font-weight: normal;
        }

        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: var(--tag-bg);
            border: 1px solid #ffd8bf;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            display: flex;
            flex-direction: column;
        }

        .tag:hover {
            border-color: var(--primary-color);
            background: #ffe7d6;
            transform: translateY(-1px);
        }

        .tag .en {
            font-weight: 600;
            color: #222;
        }

        .tag .cn {
            font-size: 11px;
            color: #666;
            margin-top: 2px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px 0;
            color: #888;
            font-size: 13px;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>TEMU Men's SEO Center</h1>
        <p>TEMU 男装类目 SEO 标题构建与关键词检索中心（马甲 | 背带裤 | 骑行服 | 连体服）</p>
    </header>

    <!-- 标题拼装工作区 -->
    <div class="builder-card">
        <div class="builder-header">
            <span class="builder-title">🛠️ 标题拼装生成器 (点击下方的关键词可直接插入)</span>
            <span class="char-counter" id="charCounter">字符数: 0 / 180 (建议 60-120 字符)</span>
        </div>
        <textarea id="titleInput" placeholder="点击下方的关键词，或在此处直接编辑你的商品标题..."></textarea>
        <div class="builder-controls">
            <button class="btn-primary" onclick="copyTitle()">📋 一键复制标题</button>
            <button class="btn-secondary" onclick="clearTitle()">🗑️ 清空内容</button>
        </div>
    </div>

    <!-- 搜索与筛选区 -->
    <div class="search-section">
        <div class="search-row">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 输入中英文关键词检索 (如: Vest, 跑步, Quick Dry)..." oninput="filterKeywords()">
        </div>
        <div class="filter-group">
            <span class="filter-label">大类筛选:</span>
            <div id="categoryFilters" class="filter-group"></div>
        </div>
        <div class="filter-group">
            <span class="filter-label">词属性筛选:</span>
            <div id="subCategoryFilters" class="filter-group"></div>
        </div>
        <div class="stats-bar" id="statsBar">加载中...</div>
    </div>

    <!-- 关键词展示区 -->
    <div class="keywords-grid" id="keywordsGrid">
        <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">正在读取 keywords.json 词库数据...</div>
    </div>

    <footer>
        <p>© 2026 TEMU Men's Apparel Operations | 静态词库架构 - 支持一键通过 Excel 转换为 JSON 更新</p>
    </footer>

    <script>
        let rawData = [];
        let selectedCategory = 'all';
        let selectedSubCategory = 'all';

        // 页面初始化
        document.addEventListener("DOMContentLoaded", () => {
            loadKeywords();
            const textarea = document.getElementById("titleInput");
            textarea.addEventListener("input", updateCounter);
        });

        // Fetch JSON 数据
        async function loadKeywords() {
            try {
                const response = await fetch('keywords.json?v=' + new Date().getTime());
                if (!response.ok) {
                    throw new Error("无法读取 keywords.json 文件");
                }
                rawData = await response.json();
                buildFilters();
                renderKeywords();
            } catch (error) {
                document.getElementById("keywordsGrid").innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: red;">
                        ⚠️ 加载词库失败！请确保仓库根目录下已提交 <b>keywords.json</b> 文件。<br>错误原因: ${error.message}
                    </div>`;
            }
        }

        // 动态构建筛选按钮
        function buildFilters() {
            // 品类（大类）
            const categories = ['all', ...new Set(rawData.map(item => item.category))];
            const catContainer = document.getElementById("categoryFilters");
            catContainer.innerHTML = categories.map(cat => {
                const name = cat === 'all' ? '全部品类' : cat;
                return `<button class="filter-btn ${cat === 'all' ? 'active' : ''}" onclick="selectCategory('${cat}', this)">${name}</button>`;
            }).join('');

            // 分类（词属性）
            const subCategories = ['all', ...new Set(rawData.map(item => item.subCategory))];
            const subCatContainer = document.getElementById("subCategoryFilters");
            subCatContainer.innerHTML = subCategories.map(sub => {
                const name = sub === 'all' ? '全部属性' : sub;
                return `<button class="filter-btn ${sub === 'all' ? 'active' : ''}" onclick="selectSubCategory('${sub}', this)">${name}</button>`;
            }).join('');
        }

        function selectCategory(cat, btn) {
            selectedCategory = cat;
            btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderKeywords();
        }

        function selectSubCategory(sub, btn) {
            selectedSubCategory = sub;
            btn.parentElement.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderKeywords();
        }

        // 渲染关键词列表
        function renderKeywords() {
            const grid = document.getElementById("keywordsGrid");
            const filterText = document.getElementById("searchInput").value.toLowerCase().trim();

            // 过滤数据
            let filtered = rawData.filter(item => {
                const matchCat = (selectedCategory === 'all' || item.category === selectedCategory);
                const matchSub = (selectedSubCategory === 'all' || item.subCategory === selectedSubCategory);
                const matchText = !filterText || 
                                  item.en.toLowerCase().includes(filterText) || 
                                  item.cn.toLowerCase().includes(filterText);
                return matchCat && matchSub && matchText;
            });

            document.getElementById("statsBar").innerText = `当前展示 ${filtered.length} 个关键词 (总计 ${rawData.length} 个词汇)`;

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">未找到匹配的关键词</div>`;
                return;
            }

            // 按 (品类 + 属性) 分组
            const groups = {};
            filtered.forEach(item => {
                const groupKey = `${item.category} - ${item.subCategory}`;
                if (!groups[groupKey]) groups[groupKey] = [];
                groups[groupKey].push(item);
            });

            grid.innerHTML = "";

            Object.keys(groups).forEach(groupKey => {
                const card = document.createElement("div");
                card.className = "category-card";
                
                const wordsHTML = groups[groupKey].map(w => `
                    <div class="tag" onclick="appendWord('${escapeQuotes(w.en)}')">
                        <span class="en">${escapeHTML(w.en)}</span>
                        <span class="cn">${escapeHTML(w.cn)}</span>
                    </div>
                `).join("");

                card.innerHTML = `
                    <h3><span>${escapeHTML(groupKey)}</span><span class="count">${groups[groupKey].length}个</span></h3>
                    <div class="tag-group">${wordsHTML}</div>
                `;

                grid.appendChild(card);
            });
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\'");
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        // 追加关键词到标题文本框
        function appendWord(word) {
            const textarea = document.getElementById("titleInput");
            let currentText = textarea.value.trim();
            
            if (currentText === "") {
                textarea.value = word;
            } else {
                textarea.value = currentText + " " + word;
            }
            updateCounter();
        }

        // 更新字符计数器
        function updateCounter() {
            const textarea = document.getElementById("titleInput");
            const counter = document.getElementById("charCounter");
            const length = textarea.value.length;
            counter.innerText = `字符数: ${length} / 180 (建议 60-120 字符)`;
            
            if (length > 180) {
                counter.style.color = "red";
            } else {
                counter.style.color = "#666";
            }
        }

        // 一键复制
        function copyTitle() {
            const textarea = document.getElementById("titleInput");
            if (!textarea.value.trim()) {
                alert("标题内容为空！");
                return;
            }
            textarea.select();
            document.execCommand("copy");
            alert("标题已成功复制到剪贴板！");
        }

        // 清空
        function clearTitle() {
            document.getElementById("titleInput").value = "";
            updateCounter();
        }

        // 搜索框筛选
        function filterKeywords() {
            renderKeywords();
        }
    </script>
</body>
</html>
