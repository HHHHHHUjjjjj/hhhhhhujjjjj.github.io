<html lang="zh-CN">

    <style>

        :root {
            --orange: #ff5a00;
            --orange-light: #fff3ed;
            --ink: #222;
            --muted: #707070;
            --line: #e5e7eb;
            --page: #f6f7f9;
            --green: #11998e;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "Microsoft YaHei",
                sans-serif;
        }


        /* =========================
           顶部
        ========================== */

        .page-header {
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .header-inner,
        main {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .header-inner {
            min-height: 66px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;
        }

        .back-link {
            color: var(--orange);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .brand {
            color: var(--muted);
            font-size: 12px;
        }


        /* =========================
           主体
        ========================== */

        main {
            padding: 42px 0 64px;
        }

        .intro {
            margin-bottom: 28px;
        }

        .eyebrow {
            margin: 0 0 8px;

            color: var(--orange);

            font-size: 11px;
            font-weight: 800;

            letter-spacing: 1.5px;
        }

        h1 {
            margin: 0;

            font-size: clamp(28px, 5vw, 44px);
            line-height: 1.15;
        }

        .intro p {
            max-width: 700px;

            margin: 12px 0 0;

            color: var(--muted);
            font-size: 14px;
            line-height: 1.7;
        }


        /* =========================
           分类
        ========================== */

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 16px;

            margin-bottom: 18px;
        }

        .toolbar-title {
            margin: 0;

            font-size: 18px;
            font-weight: 750;
        }

        .category-tabs {
            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-bottom: 18px;
        }

        .category-tab {
            padding: 8px 14px;

            border: 1px solid var(--line);
            border-radius: 999px;

            background: #fff;
            color: var(--muted);

            cursor: pointer;

            font: inherit;
            font-size: 13px;
            font-weight: 700;

            transition:
                background .2s ease,
                color .2s ease,
                border-color .2s ease;
        }

        .category-tab:hover,
        .category-tab.active {
            border-color: var(--orange);

            background: var(--orange);

            color: #fff;
        }


        /* =========================
           上品路径区域
        ========================== */

        .category-paths {
            margin-bottom: 24px;

            padding: 18px 20px;

            border: 1px solid #ffd8c4;
            border-radius: 12px;

            background: var(--orange-light);
        }

        .category-paths-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 12px;
        }

        .category-paths-title {
            display: flex;
            align-items: center;

            gap: 8px;

            color: #333;

            font-size: 15px;
            font-weight: 800;
        }

        .category-paths-title::before {
            content: "";

            width: 4px;
            height: 17px;

            border-radius: 3px;

            background: var(--orange);
        }

        .category-paths-tip {
            color: #999;
            font-size: 12px;
        }

        .path-list {
            display: flex;
            flex-direction: column;

            gap: 8px;

            max-height: 240px;

            overflow-y: auto;

            padding-right: 4px;

            scrollbar-color: #ffb08a transparent;
            scrollbar-width: thin;
        }

        .path-list.expanded {
            max-height: none;
            overflow-y: visible;
        }

        .path-list::-webkit-scrollbar {
            width: 8px;
        }

        .path-list::-webkit-scrollbar-thumb {
            border-radius: 8px;
            background: #ffb08a;
        }

        .path-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .path-expand-btn {
            display: block;

            width: 100%;

            margin-top: 10px;
            padding: 8px 12px;

            border: 1px solid #ffc5a8;
            border-radius: 7px;

            background: #fff;
            color: var(--orange);

            cursor: pointer;

            font: inherit;
            font-size: 12px;
            font-weight: 700;

            transition: background .2s ease, border-color .2s ease;
        }

        .path-expand-btn:hover {
            border-color: var(--orange);
            background: #fff8f4;
        }

        .path-item {
            display: flex;
            align-items: center;

            gap: 10px;

            min-width: 0;

            padding: 10px 12px;

            border: 1px solid #f0d8ca;
            border-radius: 8px;

            background: #fff;
        }

        .path-text {
            flex: 1;

            min-width: 0;

            color: #444;

            font-size: 12px;
            line-height: 1.6;

            word-break: break-all;
        }

        .path-copy-btn {
            flex: 0 0 auto;

            padding: 5px 11px;

            border: 0;
            border-radius: 6px;

            background: #eef0ff;
            color: #3a47d5;

            cursor: pointer;

            font-size: 12px;
            font-weight: 600;

            white-space: nowrap;

            transition: all .2s ease;
        }

        .path-copy-btn:hover {
            background: #3a47d5;
            color: #fff;
        }

        .path-copy-btn.copied {
            background: var(--green);
            color: #fff;
        }


        /* =========================
           图片区域
        ========================== */

        .gallery {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(220px, 1fr));

            gap: 16px;
        }

        .empty-state {
            grid-column: 1 / -1;

            padding: 70px 24px;

            border: 1px dashed #d5d9df;
            border-radius: 10px;

            background: #fff;

            text-align: center;
        }

        .empty-state strong {
            display: block;

            margin-bottom: 8px;

            font-size: 17px;
        }

        .empty-state span {
            color: var(--muted);

            font-size: 13px;
        }


        /* =========================
           图片卡片
        ========================== */

        .image-card {
            overflow: hidden;

            margin: 0;

            border: 1px solid var(--line);
            border-radius: 10px;

            background: #fff;

            box-shadow:
                0 2px 8px rgba(0, 0, 0, .04);
        }

        .image-button {
            display: block;

            width: 100%;

            padding: 0;

            border: 0;

            background: #f1f2f4;

            cursor: zoom-in;

            overflow: hidden;
        }

        .image-button img {
            display: block;

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            background: #f1f2f4;

            transition: transform .25s ease;
        }

        .image-button:hover img {
            transform: scale(1.03);
        }

        .image-name {
            padding: 10px 12px;

            color: var(--muted);

            font-size: 12px;

            word-break: break-word;
        }


        /* =========================
           图片加载失败
        ========================== */

        .image-loading {
            display: flex;

            align-items: center;
            justify-content: center;

            aspect-ratio: 1 / 1;

            background: #f1f2f4;

            color: #aaa;

            font-size: 12px;
        }


        /* =========================
           Lightbox
        ========================== */

        .lightbox {
            position: fixed;

            inset: 0;

            z-index: 10;

            display: grid;

            place-items: center;

            padding: 24px;

            background: rgba(15, 18, 22, .88);
        }

        .lightbox[hidden] {
            display: none;
        }

        .lightbox img {
            max-width: min(1100px, 94vw);
            max-height: 86vh;

            object-fit: contain;
        }

        .close-button {
            position: fixed;

            top: 18px;
            right: 22px;

            width: 42px;
            height: 42px;

            border: 1px solid rgba(255,255,255,.45);
            border-radius: 50%;

            background: rgba(0,0,0,.25);

            color: #fff;

            cursor: pointer;

            font-size: 25px;
            line-height: 1;
        }


        /* =========================
           Focus
        ========================== */

        .back-link:focus-visible,
        .category-tab:focus-visible,
        .close-button:focus-visible,
        .path-copy-btn:focus-visible,
        .path-expand-btn:focus-visible {
            outline: 3px solid #ffbf91;
            outline-offset: 3px;
        }


        /* =========================
           手机端
        ========================== */

        @media (max-width: 700px) {

            .category-paths {
                padding: 15px;
            }

            .category-paths-header {
                align-items: flex-start;
                flex-direction: column;

                gap: 5px;
            }

            .path-item {
                align-items: flex-start;
            }

            .path-copy-btn {
                margin-top: 1px;
            }

        }


        @media (max-width: 560px) {

            .header-inner,
            main {
                width: min(100% - 24px, 1180px);
            }

            main {
                padding-top: 30px;
            }

            .gallery {
                grid-template-columns:

                gap: 10px;
            }

            .path-text {
                font-size: 11px;
            }

            .path-copy-btn {
                padding: 4px 8px;

                font-size: 11px;
            }

        }

    </style>

</head>

/* =========================================================
   复制文本
========================================================= */

async function copyText(text, button) {

    try {

        await navigator.clipboard.writeText(text);

    } catch (error) {

        const textarea =
            document.createElement('textarea');

        textarea.value = text;

        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand('copy');

        textarea.remove();
    }


    const originalText =
        button.textContent;

    button.textContent = '已复制';

    button.classList.add('copied');


    setTimeout(() => {

        button.textContent = originalText;

        button.classList.remove('copied');

    }, 1200);

}


/* =========================================================
   渲染上品路径
========================================================= */

function renderCategoryPaths(category) {

    /*
     * 如果 JSON 分类名称和路径名称不完全一致，
     * 自动进行兼容处理
     */

    let paths =
        categoryPathsData[category];


    if (!paths) {

        if (category.includes('马甲')) {
            paths = categoryPathsData['马甲'];
        }

        else if (category.includes('背带裤')) {
            paths = categoryPathsData['背带裤'];
        }

        else if (category.includes('骑行')) {
            paths = categoryPathsData['骑行服'];
        }

        else if (
            category.includes('练功') ||
            category.includes('连体')
        ) {
            paths = categoryPathsData['练功服'];
        }

        else if (category.includes('防晒')) {
            paths = categoryPathsData['防晒衫'];
        }

        else if (category.includes('风衣')) {
            paths = categoryPathsData['风衣'];
        }

        else if (
            category.includes('外套') ||
            category.includes('夹克')
        ) {
            paths = categoryPathsData['外套夹克'];
        }

        else if (category.includes('短裤')) {
            paths = categoryPathsData['短裤'];
        }

    }


    pathList.replaceChildren();


    if (!paths || !paths.length) {

        categoryPaths.hidden = true;

        return;
    }


    categoryPaths.hidden = false;

    pathList.classList.remove('expanded');

    pathExpandBtn.hidden = paths.length <= 5;
    pathExpandBtn.setAttribute('aria-expanded', 'false');
    pathExpandBtn.textContent = `展开全部路径（${paths.length}条）`;


    paths.forEach((path) => {

        const item =
            document.createElement('div');

        item.className = 'path-item';


        const text =
            document.createElement('span');

        text.className = 'path-text';

        text.textContent = path;


        const button =
            document.createElement('button');

        button.type = 'button';

        button.className = 'path-copy-btn';

        button.textContent = '复制';


        button.addEventListener(
            'click',
            () => copyText(path, button)
        );


        item.appendChild(text);

        item.appendChild(button);

        pathList.appendChild(item);

    });

}

pathExpandBtn.addEventListener('click', () => {
    const expanded = pathList.classList.toggle('expanded');

    pathExpandBtn.setAttribute('aria-expanded', String(expanded));
    pathExpandBtn.textContent = expanded ? '收起路径' : `展开全部路径（${pathList.children.length}条）`;
});


/* =========================================================
   Lightbox
========================================================= */

function openLightbox(src, alt) {

    lightboxImage.src = src;

    lightboxImage.alt =
        alt || '放大预览';

    lightbox.hidden = false;

    closeLightbox.focus();

}


function hideLightbox() {

    lightbox.hidden = true;

    lightboxImage.removeAttribute('src');

}


/* =========================================================
   添加图片
========================================================= */

function addImage(thumbnailSrc, fullSrc, name, index) {

    const card =
        document.createElement('figure');

    card.className =
        'image-card';


    const button =
        document.createElement('button');

    button.className =
        'image-button';

    button.type = 'button';

    button.setAttribute(
        'aria-label',
        `放大查看第 ${index + 1} 张图片`
    );


    const img =
        document.createElement('img');


    /*
     * 前20张优先加载
     */

    if (index < FIRST_LOAD_COUNT) {

        img.loading = 'eager';

        /*
         * 前几张增加 fetchpriority
         * 浏览器会优先请求
         */

        if (index < 8) {
            img.fetchPriority = 'high';
        }

    } else {

        /*
         * 第21张以后懒加载
         */

        img.loading = 'lazy';

        img.fetchPriority = 'low';

    }


    img.decoding = 'async';

    img.src = thumbnailSrc;

    img.alt =
        name || `${activeCategory} 热卖商品 ${index + 1}`;


    /*
     * 图片加载失败
     */

    img.addEventListener(
        'error',
        () => {

            const loading =
                document.createElement('div');

            loading.className =
                'image-loading';

            loading.textContent =
                '图片加载失败';

            button.replaceChildren(loading);

        }
    );


    /*
     * 点击放大
     */

    button.addEventListener(
        'click',
        () => openLightbox(
            fullSrc,
            img.alt
        )
    );


    button.appendChild(img);

    card.appendChild(button);

    gallery.appendChild(card);

}


/* =========================================================
   渲染分类
========================================================= */

function renderCategory(category) {

    activeCategory = category;


    const images =
        categoryData[category] || [];


    galleryTitle.textContent =
        `${category} · 热卖图片`;


    /*
     * 显示对应上品路径
     */

    renderCategoryPaths(category);


    /*
     * 清空图片
     */

    gallery.replaceChildren();


    /*
     * 图片数量
     */

    if (!images.length) {

        emptyState.hidden = false;

        emptyState.querySelector(
            'strong'
        ).textContent =
            '暂无热卖图片';

        emptyState.querySelector(
            'span'
        ).textContent =
            '当前分类暂无可展示商品。';

        gallery.appendChild(
            emptyState
        );

    } else {

        /*
         * 有图片
         */

        emptyState.hidden = true;


        /*
         * 先创建前20张
         */

        images.forEach(
            ({ thumbnail_url: thumbnailSrc, image_url: fullSrc, rank }, index) => {

                addImage(
                    thumbnailSrc,
                    fullSrc,
                    `${category} · TOP ${rank || index + 1}`,
                    index
                );

            }
        );

    }


    /*
     * 更新分类按钮状态
     */

    categoryTabs
        .querySelectorAll('.category-tab')
        .forEach((tab) => {

            const active =
                tab.dataset.category ===
                activeCategory;

            tab.classList.toggle(
                'active',
                active
            );

            tab.setAttribute(
                'aria-selected',
                active
                    ? 'true'
                    : 'false'
            );

        });

}


/* =========================================================
   分类按钮
========================================================= */

function renderCategoryTabs() {

    categoryTabs.replaceChildren();


    Object.keys(categoryData)
        .forEach((category) => {

            const tab =
                document.createElement('button');

            tab.className =
                'category-tab';

            tab.type = 'button';

            tab.dataset.category =
                category;

            tab.textContent =
                category;

            tab.setAttribute(
                'aria-selected',
                'false'
            );


            tab.addEventListener(
                'click',
                () => renderCategory(category)
            );


            categoryTabs.appendChild(tab);

        });

}


/* =========================================================
   加载 JSON
========================================================= */

async function loadHotSaleData() {

    try {

        /*
         * JSON 本身优先加载
         */

        const response =
            await fetch(
                'assets/hot-sale/hot-sale.json'
            );


        if (!response.ok) {

            throw new Error(
                `HTTP ${response.status}`
            );

        }


        const data =
            await response.json();


        categoryData =
            data.hot_sale || {};


        /*
         * 创建分类按钮
         */

        renderCategoryTabs();


        /*
         * 默认打开第一个分类
         */

        const firstCategory =
            Object.keys(categoryData)[0];


        if (firstCategory) {

            renderCategory(
                firstCategory
            );

        } else {

            emptyState.hidden = false;

            emptyState.querySelector(
                'strong'
            ).textContent =
                '暂无热卖图片';

            emptyState.querySelector(
                'span'
            ).textContent =
                'JSON 中暂时没有可展示的分类。';

        }

    } catch (error) {

        console.error(
            '热卖图片加载失败:',
            error
        );


        emptyState.hidden = false;


        emptyState.querySelector(
            'strong'
        ).textContent =
            '热卖图片加载失败';


        emptyState.querySelector(
            'span'
        ).textContent =
            '请检查 assets/hot-sale/hot-sale.json 是否可以正常访问。';

    }

}


/* =========================================================
   初始化
========================================================= */

loadHotSaleData();


/* =========================================================
   Lightbox 操作
========================================================= */

closeLightbox.addEventListener(
    'click',
    hideLightbox
);


lightbox.addEventListener(
    'click',
    (event) => {

        if (
            event.target === lightbox
        ) {

            hideLightbox();

        }

    }
);


document.addEventListener(
    'keydown',
    (event) => {

        if (
            event.key === 'Escape' &&
            !lightbox.hidden
        ) {

            hideLightbox();

        }

    }
);


</script>
