<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="去年10月热卖商品图片推荐">
    <title>去年10热卖推荐 | TEMU 楚古月</title>
    <style>
        :root {
            --orange: #ff5a00;
            --ink: #222;
            --muted: #707070;
            --line: #e5e7eb;
            --page: #f6f7f9;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--page);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        }

        .page-header {
            background: #fff;
            border-bottom: 1px solid var(--line);
        }

        .header-inner,
        main {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
        }

        .header-inner {
            min-height: 66px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .back-link {
            color: var(--orange);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }

        .brand {
            color: var(--muted);
            font-size: 12px;
        }

        main { padding: 42px 0 64px; }

        .intro { margin-bottom: 28px; }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--orange);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        h1 {
            margin: 0;
            font-size: clamp(28px, 5vw, 44px);
            line-height: 1.15;
        }

        .intro p {
            max-width: 620px;
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .toolbar-title { font-size: 18px; font-weight: 750; }

        .back-link:focus-visible,
        .close-button:focus-visible { outline: 3px solid #ffbf91; outline-offset: 3px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 70px 24px;
            border: 1px dashed #d5d9df;
            border-radius: 10px;
            background: #fff;
            text-align: center;
        }

        .empty-state strong { display: block; margin-bottom: 8px; font-size: 17px; }
        .empty-state span { color: var(--muted); font-size: 13px; }

        .image-card {
            overflow: hidden;
            margin: 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
        }

        .image-button {
            display: block;
            width: 100%;
            padding: 0;
            border: 0;
            background: #f1f2f4;
            cursor: zoom-in;
        }

        .image-button img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            transition: transform .25s ease;
        }

        .image-button:hover img { transform: scale(1.03); }
        .image-name { padding: 10px 12px; color: var(--muted); font-size: 12px; word-break: break-word; }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(15, 18, 22, .88);
        }

        .lightbox[hidden] { display: none; }
        .lightbox img { max-width: min(1100px, 94vw); max-height: 86vh; object-fit: contain; }

        .close-button {
            position: fixed;
            top: 18px;
            right: 22px;
            width: 42px;
            height: 42px;
            border: 1px solid rgba(255,255,255,.45);
            border-radius: 50%;
            background: rgba(0,0,0,.25);
            color: #fff;
            cursor: pointer;
            font-size: 25px;
            line-height: 1;
        }

        @media (max-width: 560px) {
            .header-inner, main { width: min(100% - 24px, 1180px); }
            main { padding-top: 30px; }
            .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        }
    </style>
</head>
<body>
    <header class="page-header">
        <div class="header-inner">
            <a class="back-link" href="index.html">← 返回首页</a>
            <span class="brand">TEMU 楚古月 · 热卖资料</span>
        </div>
    </header>

    <main>
        <section class="intro">
            <p class="eyebrow">BEST SELLERS · LAST OCTOBER</p>
            <h1>去年10热卖推荐</h1>
            <p>集中查看去年10月热卖商品图片，点击任意图片即可放大浏览。</p>
        </section>

        <section aria-labelledby="galleryTitle">
            <div class="toolbar">
                <h2 class="toolbar-title" id="galleryTitle">热卖图片</h2>
            </div>
            <div class="gallery" id="gallery">
                <div class="empty-state" id="emptyState">
                    <strong>还没有热卖图片</strong>
                    <span>请将商品图片添加到 assets/hot-sale/ 文件夹，并在页面中登记图片路径。</span>
                </div>
            </div>
        </section>
    </main>

    <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="图片预览">
        <button class="close-button" id="closeLightbox" type="button" aria-label="关闭图片预览">×</button>
        <img id="lightboxImage" alt="放大预览">
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const emptyState = document.getElementById('emptyState');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightboxImage');
        const closeLightbox = document.getElementById('closeLightbox');

        // Add project images here after placing them in assets/hot-sale/.
        const imageFiles = [];

        function openLightbox(src, alt) {
            lightboxImage.src = src;
            lightboxImage.alt = alt;
            lightbox.hidden = false;
            closeLightbox.focus();
        }

        function hideLightbox() {
            lightbox.hidden = true;
            lightboxImage.removeAttribute('src');
        }

        function addImage(src, name) {
            const card = document.createElement('figure');
            card.className = 'image-card';
            card.innerHTML = `
                <button class="image-button" type="button" aria-label="放大查看 ${name}">
                    <img src="${src}" alt="${name}">
                </button>
                <figcaption class="image-name">${name}</figcaption>
            `;
            card.querySelector('.image-button').addEventListener('click', () => openLightbox(src, name));
            gallery.appendChild(card);
        }

        imageFiles.forEach(({ src, name }) => addImage(src, name));
        if (imageFiles.length) emptyState.hidden = true;

        closeLightbox.addEventListener('click', hideLightbox);
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) hideLightbox();
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !lightbox.hidden) hideLightbox();
        });
    </script>
</body>
</html>
